/**
 * Extend Module Dependencies
 *
 * This file contains all dependencies specific to the extend module functionality.
 * It is included in the main dependencies.gradle file to maintain fork-safety.
 *
 * When updating upstream Fineract, this file can be preserved while the main
 * dependencies.gradle can be safely updated from upstream.
 */

dependencies {
    // =============================================================================
    // EXTEND MODULE DEPENDENCIES
    // =============================================================================

    // docx4j for modern Word document processing with Content Controls
    implementation 'org.docx4j:docx4j-JAXB-ReferenceImpl:11.5.3'

    // JAXB implementation for docx4j support
    // Core JAXB dependencies are in main dependencies.gradle
    // docx4j needs additional JAXB runtime implementation for ContextFactory
    // Using compatible versions: jaxb-runtime 2.3.6 with jaxb-core 2.3.0.1
    implementation 'org.glassfish.jaxb:jaxb-core:2.3.0.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.6'

    // =============================================================================
    // CREDIT BUREAU / KYC DEPENDENCIES
    // =============================================================================
    // Add any additional dependencies for credit bureau providers here
    // Example:
    // implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    // implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // =============================================================================
    // EXTEND MODULE TESTING DEPENDENCIES
    // =============================================================================
    // Add test-specific dependencies for extend module here
    // testImplementation 'org.testcontainers:testcontainers:1.19.0'
}

// =============================================================================
// BUILD ORDER FIX FOR COMPILATION ISSUES
// =============================================================================

// Fix for fineract-provider: ensure test compilation runs after main compilation
tasks.named('compileTestJava').configure {
    dependsOn tasks.named('compileJava')
}

// Cross-project fix for fineract-command compilation issues
// This ensures fineract-command test compilation depends on its main compilation
// Applied from extend module to avoid upstream changes
gradle.projectsEvaluated {
    def commandProject = rootProject.findProject(':fineract-command')
    if (commandProject) {
        commandProject.tasks.named('compileTestJava').configure {
            dependsOn commandProject.tasks.named('compileJava')
        }
    }
}
